<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
<title>Gastos</title>
<meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0b0c10">
<meta name="theme-color" media="(prefers-color-scheme: light)" content="#f2f3f6">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Gastos">
<link rel="stylesheet" href="style.css">
</head>
<body>

<div id="app">

  <!-- Barra de viaje -->
  <div id="trip-bar" class="trip-inactive">
    <div id="trip-bar-main">
      <div id="trip-info">
        <span id="trip-status">Sin viaje activo</span>
        <span id="trip-total"></span>
        <span id="trip-deposit"></span>
      </div>
      <button id="trip-toggle-btn" class="trip-btn">Iniciar viaje</button>
    </div>
    <button id="trip-deposit-btn" class="deposit-btn"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.3"/><path d="M2.5 10.2h19"/><circle cx="17" cy="14.3" r="1.1"/></svg>Agregar depósito</button>
  </div>

  <!-- Vista: Registrar -->
  <main id="view-registrar" class="view active">

    <div id="amount-display">$<span id="amount-value">0</span></div>

    <div id="keypad">
      <button class="key" data-key="1">1</button>
      <button class="key" data-key="2">2</button>
      <button class="key" data-key="3">3</button>
      <button class="key" data-key="4">4</button>
      <button class="key" data-key="5">5</button>
      <button class="key" data-key="6">6</button>
      <button class="key" data-key="7">7</button>
      <button class="key" data-key="8">8</button>
      <button class="key" data-key="9">9</button>
      <button class="key" data-key=".">.</button>
      <button class="key" data-key="0">0</button>
      <button class="key key-back" data-key="back"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M9 5h11a1 1 0 0 1 1 1v12a1 1 0 0 1-1 1H9l-6-7Z"/><path d="M13 9.5 18 14.5M18 9.5 13 14.5"/></svg></button>
    </div>

    <div id="categories">
      <button class="cat-btn" data-cat="Caseta"><svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M8.5 3 5 21"/><path d="M15.5 3 19 21"/><path d="M12 3v2.5M12 9v2.5M12 15v2.5"/></svg><span>Caseta</span></button>
      <button class="cat-btn" data-cat="Gasolina"><svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V5a2 2 0 0 1 2-2h6a2 2 0 0 1 2 2v16"/><path d="M4 21h10"/><path d="M9 10H7"/><path d="M14 8.5h2.5L19 11v6a1.5 1.5 0 0 1-3 0v-3h-2"/></svg><span>Gasolina</span></button>
      <button class="cat-btn" data-cat="Estacionamiento"><svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M9.5 16V8h3.2a2.4 2.4 0 1 1 0 4.8H9.5"/></svg><span>Estac.</span></button>
      <button class="cat-btn" data-cat="Hotel"><svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19v-6a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v2"/><path d="M3 21h18"/><path d="M12 15V8a2 2 0 0 1 2-2h5a2 2 0 0 1 2 2v7"/><circle cx="7" cy="12.5" r="1.3"/></svg><span>Hotel</span></button>
      <button class="cat-btn cat-otro" data-cat="__custom__"><svg class="icon icon-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg><span>Otro</span></button>
    </div>

  </main>

  <!-- Vista: Historial -->
  <main id="view-historial" class="view">
    <div id="historial-list"></div>
  </main>

  <!-- Vista: Detalle de viaje -->
  <main id="view-detalle" class="view">
    <button id="detalle-back" class="back-link"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 4.5 7 12l7.5 7.5"/></svg>Historial</button>
    <h2 id="detalle-titulo"></h2>
    <div id="detalle-total"></div>
    <div id="detalle-deposito"></div>
    <div id="detalle-depositos"></div>
    <div id="detalle-items"></div>
    <div id="detalle-actions">
      <button id="btn-agregar-deposito" class="action-btn"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="13" rx="2.3"/><path d="M2.5 10.2h19"/><circle cx="17" cy="14.3" r="1.1"/></svg>Agregar depósito</button>
      <button id="btn-editar" class="action-btn"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>Editar</button>
      <button id="btn-copiar" class="action-btn"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15V5a2 2 0 0 1 2-2h10"/></svg>Copiar resumen</button>
      <button id="btn-compartir" class="action-btn"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="2.3"/><circle cx="6" cy="12" r="2.3"/><circle cx="18" cy="19" r="2.3"/><path d="M8 10.7 16 6.3M8 13.3l8 4.4"/></svg>Compartir</button>
      <button id="btn-borrar-viaje" class="action-btn danger"><svg class="icon icon-sm" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M4 7h16"/><path d="M9 7V4.5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1V7"/><path d="M6 7l1 13a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2l1-13"/><path d="M10 11v6M14 11v6"/></svg>Borrar viaje</button>
    </div>
  </main>

  <!-- Tab bar -->
  <nav id="tabbar">
    <button class="tab-btn active" data-view="registrar"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v8M8 12h8"/></svg><span>Registrar</span></button>
    <button class="tab-btn" data-view="historial"><svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12a1 1 0 0 1 1 1v16l-3-2-2.5 2-2.5-2-2.5 2-2.5-2-3 2V4a1 1 0 0 1 1-1Z"/><path d="M8.5 8h7M8.5 12h7M8.5 16h4"/></svg><span>Historial</span></button>
  </nav>

  <div id="toast"></div>

  <div id="deposit-modal" class="modal-overlay">
    <div class="modal-box">
      <h3 id="deposit-modal-title">Nuevo depósito de la empresa</h3>
      <input id="deposit-input" type="text" inputmode="decimal" enterkeyhint="done" placeholder="0.00">
      <div class="modal-actions">
        <button id="deposit-cancel" class="modal-btn">Cancelar</button>
        <button id="deposit-save" class="modal-btn primary">Guardar</button>
      </div>
    </div>
  </div>

  <div id="desc-modal" class="modal-overlay">
    <div class="modal-box">
      <h3 id="desc-modal-title">Descripción del gasto</h3>
      <input id="desc-input" type="text" enterkeyhint="done" placeholder="Ej. recarga celular, comida, herramienta">
      <div class="modal-actions">
        <button id="desc-cancel" class="modal-btn">Cancelar</button>
        <button id="desc-save" class="modal-btn primary">Guardar</button>
      </div>
    </div>
  </div>

</div>

<script src="capacitor.js"></script>
<script src="capacitor-updater.js"></script>
<script src="app.js"></script>
</body>
</html>
